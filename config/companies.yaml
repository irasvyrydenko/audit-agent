# Company set for development, evaluation and the demo (confirmed 2026-10-27).
# CIKs are resolved at runtime from EDGAR company_tickers.json. Set `cik` only when the
# ticker maps to an entity without the 10-Ks we need (D-008).
default_fiscal_year: 2024

companies:
  - ticker: AAPL
    name: Apple Inc.
    sector: Technology
    confirmed: true
    notes: Fiscal year ends late September.
  - ticker: JPM
    name: JPMorgan Chase & Co.
    sector: Financials (bank)
    bank: true  # some indicators not applicable (D-012)
    confirmed: true
    notes: >-
      Bank balance sheet — Altman Z, Beneish M and DSO are not meaningful; no
      current assets/liabilities split. Good stress test for "not applicable" handling.
  - ticker: XOM
    name: Exxon Mobil Corporation
    sector: Energy
    confirmed: true
    cik: "0000034088"
    notes: >-
      Calendar fiscal year. In 2026 the XOM ticker moved to the new ExxonMobil Holdings Corp
      (CIK 0002115436, no 10-Ks yet); historical 10-Ks are under Exxon Mobil Corp (34088).
  - ticker: JNJ
    name: Johnson & Johnson
    sector: Healthcare
    confirmed: true
    notes: Heavy litigation disclosures (useful for risk_detector).
  - ticker: WMT
    name: Walmart Inc.
    sector: Consumer Staples (retail)
    confirmed: true
    notes: Fiscal year ends Jan 31 — "FY2025" covers mostly calendar 2024.
